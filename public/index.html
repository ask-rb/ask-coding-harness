<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#0b0b0c"/>
<title>Askoda</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" type="image/svg+xml" href="/icon.svg"/>
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<style>
:root{--bg:#0b0b0c;--surface:#111216;--surface2:#1a1b22;--border:#23242a;--text:#eaeaea;--muted:#9aa0a6;--accent:#2b6ef6;--accent-hover:#1a5de0;--user-bg:#2b6ef6;--user-text:#fff;--code-bg:#0d0e14;--scrollbar:#2a2b32;}
body.light{--bg:#f6f8fb;--surface:#ffffff;--surface2:#eef1f6;--border:#d5d9e2;--text:#0b0b0c;--muted:#6b7280;--accent:#2b6ef6;--accent-hover:#1a5de0;--user-bg:#2b6ef6;--user-text:#fff;--code-bg:#f0f2f6;--scrollbar:#d5d9e2;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100%;overflow:hidden}
.sidebar{width:300px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;transition:transform .2s;z-index:100}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-header h1{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.sidebar-header h1 svg{width:20px;height:20px;color:var(--accent)}
.sidebar-actions{display:flex;gap:4px}
.sidebar-actions button{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.sidebar-actions button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.conv-list{flex:1;overflow-y:auto;padding:8px}
.conv-list::-webkit-scrollbar{width:6px}
.conv-list::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
.conv-item{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.conv-item:hover{background:var(--surface2)}
.conv-item.active{background:var(--surface2);border-color:var(--border)}
.conv-item .title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-item .meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:8px}
.delete-conv{opacity:0;margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px}
.conv-item:hover .delete-conv{opacity:1}
.delete-conv:hover{color:#ef4444;background:rgba(239,68,68,.1)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{display:none;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface);align-items:center;gap:12px}
.chat-header .menu-btn{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:4px}
.chat-header h2{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.messages{flex:1;overflow-y:auto;padding:16px 0}
.messages::-webkit-scrollbar{width:6px}
.messages::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:40px;color:var(--muted)}
.welcome svg{width:48px;height:48px;color:var(--accent);margin-bottom:16px}
.welcome h2{font-size:18px;color:var(--text);margin-bottom:8px}
.welcome p{font-size:14px;max-width:360px}
.msg-group{margin-bottom:16px;padding:0 16px}
.msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.6;word-wrap:break-word;overflow-wrap:break-word}
.msg.user{background:var(--user-bg);color:var(--user-text);margin-left:auto;border-bottom-right-radius:4px}
.msg.assistant{background:var(--surface2);border:1px solid var(--border);margin-right:auto;border-bottom-left-radius:4px}
.msg.assistant p{margin-bottom:8px}
.msg.assistant p:last-child{margin-bottom:0}
.msg.assistant pre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;margin:8px 0;overflow:hidden;position:relative}
.msg.assistant pre .lang-label{position:absolute;top:0;left:0;padding:2px 8px;font-size:11px;background:var(--surface2);color:var(--muted);border-bottom-right-radius:6px;font-family:monospace}
.msg.assistant pre .copy-btn{position:absolute;top:4px;right:4px;padding:4px 8px;font-size:11px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:4px;cursor:pointer;opacity:0;transition:opacity .15s}
.msg.assistant pre:hover .copy-btn{opacity:1}
.msg.assistant pre .copy-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.msg.assistant pre code{display:block;padding:12px;overflow-x:auto;font-family:'SF Mono',Monaco,Menlo,monospace;font-size:13px;line-height:1.5;color:var(--text)}
.msg.assistant code:not(pre code){background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:13px}
.msg.assistant ul,.msg.assistant ol{padding-left:20px;margin:8px 0}
.msg.assistant li{margin:4px 0}
.msg.assistant blockquote{border-left:3px solid var(--accent);padding:4px 12px;margin:8px 0;color:var(--muted);background:var(--code-bg);border-radius:0 4px 4px 0}
.msg.assistant table{border-collapse:collapse;margin:8px 0;width:100%;font-size:13px}
.msg.assistant th,.msg.assistant td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.msg.assistant th{background:var(--surface2);font-weight:600}
.msg.assistant a{color:var(--accent);text-decoration:none}
.msg.assistant a:hover{text-decoration:underline}
.msg.assistant h1,.msg.assistant h2,.msg.assistant h3,.msg.assistant h4{margin:12px 0 6px;line-height:1.3}
.msg.assistant h1{font-size:17px}
.msg.assistant h2{font-size:16px}
.msg.assistant h3{font-size:15px}
.msg.assistant hr{margin:12px 0;border:none;border-top:1px solid var(--border)}
.thinking{display:flex;gap:6px;padding:12px 16px;align-items:center;color:var(--muted);font-size:13px}
.thinking .dots{display:flex;gap:3px}
.thinking .dots span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.4s infinite}
.thinking .dots span:nth-child(2){animation-delay:.2s}
.thinking .dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{opacity:.3}40%{opacity:1}}
.input-area{border-top:1px solid var(--border);padding:12px 16px;background:var(--surface)}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-row textarea{flex:1;min-height:44px;max-height:120px;resize:none;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;line-height:1.4;outline:none;transition:border-color .15s}
.input-row textarea:focus{border-color:var(--accent)}
.input-row textarea::placeholder{color:var(--muted)}
.input-row button{width:44px;height:44px;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.input-row button:hover{background:var(--accent-hover)}
.input-row button:disabled{opacity:.4;cursor:not-allowed}
.input-row button svg{width:20px;height:20px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);padding:8px 16px;border-radius:8px;border:1px solid var(--border);font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
@media(max-width:768px){.sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);width:85vw;max-width:320px}.sidebar.open{transform:translateX(0)}.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}.sidebar-overlay.show{display:block}.chat-header{display:flex}.conv-item .meta{gap:6px}}
</style>
</head>
<body>
<div id="app">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Askoda</h1>
      <div class="sidebar-actions">
        <button onclick="newConversation()" title="New conversation">✚</button>
        <button onclick="toggleTheme()" id="themeBtn" title="Toggle theme">☾</button>
      </div>
    </div>
    <div class="conv-list" id="convList"></div>
  </aside>
  <main class="main">
    <div class="chat-header">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <h2 id="chatTitle">Askoda</h2>
    </div>
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <h2>Askoda</h2>
        <p>Your AI coding assistant. Start a conversation or select one from the sidebar.</p>
      </div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="Type your message..." onkeydown="handleKey(event)"></textarea>
        <button id="sendBtn" onclick="sendMessage()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
// ── State ──
let conversations = [];
let currentConvId = null;
let streaming = false;
let abortController = null;

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  loadTheme();
  loadConversations();
  setupAutoResize();
  // Auto-open sidebar on desktop
  if (window.innerWidth > 768) document.getElementById('sidebar').classList.add('open');
});

// ── Theme ──
function loadTheme() {
  const dark = localStorage.getItem('theme') !== 'light';
  document.body.classList.toggle('light', !dark);
  document.querySelector('meta[name="theme-color"]').content = dark ? '#0b0b0c' : '#f6f8fb';
  document.getElementById('themeBtn').textContent = dark ? '☀' : '☾';
}
function toggleTheme() {
  const dark = document.body.classList.toggle('light');
  localStorage.setItem('theme', dark ? 'dark' : 'light');
  loadTheme();
}

// ── Sidebar ──
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('show'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('show'); }

// ── Conversations ──
async function loadConversations() {
  try {
    const res = await fetch('/api/conversations');
    if (!res.ok) return;
    const data = await res.json();
    // Handle both array and object response formats
    conversations = Array.isArray(data) ? data : (data.conversations || []);
    renderSidebar();
  } catch(e) { console.error('Load conversations:', e); }
}

function renderSidebar() {
  const list = document.getElementById('convList');
  if (!conversations.length) {
    list.innerHTML = '<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">No conversations yet</div>';
    return;
  }
  list.innerHTML = conversations.map(c => `
    <div class="conv-item ${c.id === currentConvId ? 'active' : ''}" onclick="selectConversation('${c.id}')">
      <div class="title">${escapeHtml(c.title || 'New conversation')}</div>
      <div class="meta">
        <span>${c.message_count || 0} messages</span>
        <span>${formatTime(c.updated_at)}</span>
        <button class="delete-conv" onclick="event.stopPropagation();deleteConversation('${c.id}')" title="Delete">✕</button>
      </div>
    </div>
  `).join('');
}

async function selectConversation(id) {
  if (streaming) return;
  currentConvId = id;
  history.replaceState(null, '', `/`);
  closeSidebar();
  renderSidebar();
  try {
    const res = await fetch(`/api/conversations/${id}`);
    if (!res.ok) { currentConvId = null; return; }
    const conv = await res.json();
    renderMessages(conv.messages || []);
    document.getElementById('chatTitle').textContent = conv.title || 'Conversation';
  } catch(e) { console.error('Load conversation:', e); }
}

async function newConversation() {
  if (streaming) return;
  currentConvId = null;
  document.getElementById('chatTitle').textContent = 'Askoda';
  document.getElementById('messages').innerHTML = '<div class="welcome" id="welcome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg><h2>Askoda</h2><p>Start a new conversation.</p></div>';
  document.getElementById('input').focus();
  closeSidebar();
  renderSidebar();
}

async function deleteConversation(id) {
  try {
    await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
    if (currentConvId === id) newConversation();
    await loadConversations();
  } catch(e) { console.error('Delete:', e); }
}

// ── Messages ──
function renderMessages(msgs) {
  const container = document.getElementById('messages');
  container.innerHTML = '';
  if (!msgs || !msgs.length) {
    container.innerHTML = '<div class="welcome" id="welcome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg><h2>Askoda</h2><p>Start a new conversation.</p></div>';
    return;
  }
  msgs.forEach(m => appendMessage(m.role, m.content, false));
  scrollToBottom();
}

function appendMessage(role, content, scroll = true) {
  const container = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  
  const group = document.createElement('div');
  group.className = 'msg-group';
  
  const msg = document.createElement('div');
  msg.className = `msg ${role === 'user' ? 'user' : 'assistant'}`;
  
  if (role === 'assistant') {
    msg.innerHTML = marked.parse(content, { breaks: true });
    // Add copy buttons to code blocks
    msg.querySelectorAll('pre').forEach(pre => {
      const code = pre.querySelector('code');
      if (!code) return;
      const lang = code.className.match(/language-(\w+)/);
      if (lang) {
        const label = document.createElement('div');
        label.className = 'lang-label';
        label.textContent = lang[1];
        pre.prepend(label);
      }
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.textContent = 'Copy';
      btn.onclick = () => { navigator.clipboard.writeText(code.textContent); showToast('Copied!'); };
      pre.appendChild(btn);
    });
  } else {
    msg.textContent = content;
  }
  
  group.appendChild(msg);
  container.appendChild(group);
  if (scroll) scrollToBottom();
}

function scrollToBottom() {
  const container = document.getElementById('messages');
  requestAnimationFrame(() => { container.scrollTop = container.scrollHeight; });
}

// ── Send Message ──
async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || streaming) return;
  
  input.value = '';
  autoResize(input);
  updateSendButton();
  
  appendMessage('user', text);
  
  // Show thinking indicator
  const container = document.getElementById('messages');
  const thinkingEl = document.createElement('div');
  thinkingEl.className = 'thinking';
  thinkingEl.id = 'thinking';
  thinkingEl.innerHTML = '<span>Thinking</span><div class="dots"><span></span><span></span><span></span></div>';
  container.appendChild(thinkingEl);
  scrollToBottom();
  
  streaming = true;
  abortController = new AbortController();
  document.getElementById('sendBtn').disabled = true;
  
  try {
    const body = { message: text };
    if (currentConvId) body.conversation_id = currentConvId;
    
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: abortController.signal
    });
    
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let responseText = '';
    let newConvId = currentConvId;
    
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      
      for (const line of lines) {
        if (line.startsWith('event: conversation.created')) {
          // Next line has the data
          continue;
        }
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (typeof data === 'string') {
              newConvId = data;
              currentConvId = data;
              history.replaceState(null, '', '/');
              continue;
            }
            if (data.delta) {
              responseText += data.delta;
              updateAssistantMessage(responseText);
            }
            if (data.response) {
              responseText = data.response;
              updateAssistantMessage(responseText);
            }
            if (data.error) {
              showToast('Error: ' + data.error);
            }
          } catch(e) {}
        }
      }
    }
    
    // Final update with the assistant message
    removeThinking();
    if (responseText) {
      appendMessage('assistant', responseText);
    }
    await loadConversations();
    if (newConvId) {
      currentConvId = newConvId;
      renderSidebar();
    }
  } catch(e) {
    removeThinking();
    if (e.name !== 'AbortError') {
      appendMessage('assistant', 'Error: ' + e.message);
      showToast('Failed: ' + e.message);
    }
  } finally {
    streaming = false;
    abortController = null;
    updateSendButton();
    document.getElementById('input').focus();
  }
}

function updateAssistantMessage(text) {
  const container = document.getElementById('messages');
  const existing = document.getElementById('streaming-msg');
  if (existing) {
    existing.innerHTML = marked.parse(text, { breaks: true });
    scrollToBottom();
    return;
  }
  removeThinking();
  const group = document.createElement('div');
  group.className = 'msg-group';
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  msg.id = 'streaming-msg';
  msg.innerHTML = marked.parse(text, { breaks: true });
  group.appendChild(msg);
  container.appendChild(group);
  scrollToBottom();
}

function removeThinking() {
  const el = document.getElementById('thinking');
  if (el) el.remove();
}

// ── Input ──
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function updateSendButton() {
  const input = document.getElementById('input');
  document.getElementById('sendBtn').disabled = !input.value.trim() || streaming;
}

function setupAutoResize() {
  const textarea = document.getElementById('input');
  textarea.addEventListener('input', () => { autoResize(textarea); updateSendButton(); });
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Helpers ──
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h';
  return d.toLocaleDateString();
}
</script>
</body>
</html>
