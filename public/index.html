<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#0b0b0c"/>
<title>Askoda</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" type="image/svg+xml" href="/icon.svg"/>
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<style>
:root{--bg:#0b0b0c;--surface:#111216;--surface2:#1a1b22;--border:#23242a;--text:#eaeaea;--muted:#9aa0a6;--accent:#2b6ef6;--accent-hover:#1a5de0;--user-bg:#2b6ef6;--user-text:#fff;--code-bg:#0d0e14;--scrollbar:#2a2b32;}
body.light{--bg:#f6f8fb;--surface:#ffffff;--surface2:#eef1f6;--border:#d5d9e2;--text:#0b0b0c;--muted:#6b7280;--accent:#2b6ef6;--accent-hover:#1a5de0;--user-bg:#2b6ef6;--user-text:#fff;--code-bg:#f0f2f6;--scrollbar:#d5d9e2;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{display:flex;height:100%;overflow:hidden}
.sidebar{width:300px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;z-index:100}
.sidebar-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-header h1{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.sidebar-header h1 svg{width:18px;height:18px;color:var(--accent)}
.sidebar-actions{display:flex;gap:4px}
.sidebar-actions button{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.sidebar-actions button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.sidebar-scroll{flex:1;overflow-y:auto;padding:8px}
.sidebar-scroll::-webkit-scrollbar{width:5px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
.proj-group{margin-bottom:4px}
.proj-header{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);user-select:none}
.proj-header:hover{background:var(--surface2);color:var(--text)}
.proj-header .arrow{font-size:10px;transition:transform .15s;width:14px;text-align:center}
.proj-header .arrow.open{transform:rotate(90deg)}
.proj-header .count{font-size:11px;color:var(--muted);margin-left:auto}
.session-list{padding-left:8px}
.sess-item{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;border:1px solid transparent;margin-bottom:1px}
.sess-item:hover{background:var(--surface2)}
.sess-item.active{background:var(--surface2);border-color:var(--border)}
.sess-item .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-item .meta{font-size:11px;color:var(--muted);margin-top:2px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{display:none;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);align-items:center;gap:12px}
.chat-header .menu-btn{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;padding:4px}
.chat-header h2{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.messages{flex:1;overflow-y:auto;padding:16px 0}
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:40px;color:var(--muted)}
.welcome svg{width:40px;height:40px;color:var(--accent);margin-bottom:16px}
.welcome h2{font-size:16px;color:var(--text);margin-bottom:6px}
.welcome p{font-size:13px;max-width:340px}
.msg-group{margin-bottom:14px;padding:0 16px}
.msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.6;word-wrap:break-word}
.msg.user{background:var(--user-bg);color:var(--user-text);margin-left:auto;border-bottom-right-radius:4px}
.msg.assistant{background:var(--surface2);border:1px solid var(--border);margin-right:auto;border-bottom-left-radius:4px}
.msg.assistant p{margin-bottom:6px}
.msg.assistant p:last-child{margin-bottom:0}
.msg.assistant pre{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;margin:8px 0;overflow:hidden;position:relative}
.msg.assistant pre .lang-label{position:absolute;top:0;left:0;padding:2px 8px;font-size:11px;background:var(--surface2);color:var(--muted);border-bottom-right-radius:6px;font-family:monospace}
.msg.assistant pre .copy-btn{position:absolute;top:4px;right:4px;padding:4px 8px;font-size:11px;background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:4px;cursor:pointer;opacity:0;transition:opacity .15s}
.msg.assistant pre:hover .copy-btn{opacity:1}
.msg.assistant pre .copy-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.msg.assistant pre code{display:block;padding:12px;overflow-x:auto;font-family:'SF Mono',Monaco,Menlo,monospace;font-size:13px;line-height:1.5;color:var(--text)}
.msg.assistant code:not(pre code){background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:13px}
.msg.assistant ul,.msg.assistant ol{padding-left:20px;margin:8px 0}
.msg.assistant li{margin:4px 0}
.msg.assistant blockquote{border-left:3px solid var(--accent);padding:4px 12px;margin:8px 0;color:var(--muted);background:var(--code-bg);border-radius:0 4px 4px 0}
.msg.assistant a{color:var(--accent);text-decoration:none}
.msg.assistant a:hover{text-decoration:underline}
.msg.assistant h1,.msg.assistant h2,.msg.assistant h3,.msg.assistant h4{margin:12px 0 6px;line-height:1.3}
.msg.assistant h1{font-size:17px}
.msg.assistant h2{font-size:16px}
.msg.assistant h3{font-size:15px}
.thinking{display:flex;gap:6px;padding:12px 16px;align-items:center;color:var(--muted);font-size:13px}
.thinking .dots{display:flex;gap:3px}
.thinking .dots span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.4s infinite}
.thinking .dots span:nth-child(2){animation-delay:.2s}
.thinking .dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{opacity:.3}40%{opacity:1}}
.input-area{border-top:1px solid var(--border);padding:12px 16px;background:var(--surface)}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-row textarea{flex:1;min-height:44px;max-height:120px;resize:none;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;line-height:1.4;outline:none;transition:border-color .15s}
.input-row textarea:focus{border-color:var(--accent)}
.input-row textarea::placeholder{color:var(--muted)}
.input-row button{width:44px;height:44px;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.input-row button:hover{background:var(--accent-hover)}
.input-row button:disabled{opacity:.4;cursor:not-allowed}
.input-row button svg{width:20px;height:20px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);padding:8px 16px;border-radius:8px;border:1px solid var(--border);font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
@media(max-width:768px){.sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);width:85vw;max-width:320px}.sidebar.open{transform:translateX(0)}.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}.sidebar-overlay.show{display:block}.chat-header{display:flex}}
</style>
</head>
<body>
<div id="app">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Askoda</h1>
      <div class="sidebar-actions">
        <button onclick="newChat()" title="New chat">✚</button>
        <button onclick="toggleTheme()" id="themeBtn" title="Toggle theme">☾</button>
      </div>
    </div>
    <div class="sidebar-scroll" id="sidebarList"></div>
  </aside>
  <main class="main">
    <div class="chat-header">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <h2 id="chatTitle">Askoda</h2>
    </div>
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <h2>Askoda</h2>
        <p>Your AI coding assistant. Select a project from the sidebar or start a new chat.</p>
      </div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="Type your message..." onkeydown="handleKey(event)"></textarea>
        <button id="sendBtn" onclick="sendMessage()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
// ── State ──
let projects = [];
let expandedProj = new Set();
let sessionCache = {};
let currentSessionId = null;
let currentProjectDir = null;
let streaming = false;
let abortController = null;
let isNewChat = true;

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  loadTheme();
  loadProjects();
  setupAutoResize();
  if (window.innerWidth > 768) openSidebar();
});

function openSidebar() { document.getElementById('sidebar').classList.add('open'); }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('show'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('show'); }

// ── Theme ──
function loadTheme() {
  const dark = localStorage.getItem('theme') !== 'light';
  document.body.classList.toggle('light', !dark);
  document.querySelector('meta[name="theme-color"]').content = dark ? '#0b0b0c' : '#f6f8fb';
  document.getElementById('themeBtn').textContent = dark ? '☀' : '☾';
}
function toggleTheme() {
  const dark = document.body.classList.toggle('light');
  localStorage.setItem('theme', dark ? 'dark' : 'light');
  loadTheme();
}

// ── Projects ──
async function loadProjects() {
  try {
    const res = await fetch('/api/projects');
    if (!res.ok) return;
    const data = await res.json();
    projects = Array.isArray(data) ? data : [];
    renderSidebar();
  } catch(e) { console.error('Load projects:', e); }
}

function renderSidebar() {
  const list = document.getElementById('sidebarList');
  if (!projects.length) {
    list.innerHTML = '<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">No projects found</div>';
    return;
  }
  list.innerHTML = projects.map(p => {
    const dir = encodeURIComponent(p.directory || p.project_id);
    const name = basename(p.directory || p.project_id);
    const isOpen = expandedProj.has(p.directory);
    const sessions = sessionCache[p.directory] || [];
    return `
      <div class="proj-group">
        <div class="proj-header" onclick="toggleProject('${escapeHtml(p.directory)}')">
          <span class="arrow ${isOpen ? 'open' : ''}">▶</span>
          <span>📁 ${escapeHtml(name)}</span>
          <span class="count">${p.session_count || sessions.length}</span>
        </div>
        ${isOpen ? `<div class="session-list">${
          sessions.map(s => `
            <div class="sess-item ${s.id === currentSessionId ? 'active' : ''}" onclick="selectSession('${s.id}', '${escapeHtml(p.directory)}')">
              <div class="title">${escapeHtml(s.title || 'Untitled')}</div>
              <div class="meta">${s.message_count || 0} msgs · ${fmtTime(s.updated_at)}</div>
            </div>
          `).join('')
        }</div>` : ''}
      </div>`;
  }).join('');
}

async function toggleProject(dir) {
  if (expandedProj.has(dir)) {
    expandedProj.delete(dir);
    renderSidebar();
    return;
  }
  expandedProj.add(dir);
  if (!sessionCache[dir]) {
    try {
      const res = await fetch(`/api/projects/${encodeURIComponent(dir)}/sessions`);
      if (res.ok) sessionCache[dir] = await res.json();
    } catch(e) {}
  }
  renderSidebar();
}

async function selectSession(id, dir) {
  currentSessionId = id;
  currentProjectDir = dir;
  isNewChat = false;
  closeSidebar();
  renderSidebar();
  try {
    const res = await fetch(`/api/sessions/${id}`);
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('chatTitle').textContent = 'Session';
    renderMessages(data.messages || []);
  } catch(e) { console.error('Load session:', e); }
}

function newChat() {
  currentSessionId = null;
  currentProjectDir = null;
  isNewChat = true;
  document.getElementById('chatTitle').textContent = 'Askoda';
  document.getElementById('messages').innerHTML = '<div class="welcome" id="welcome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg><h2>Askoda</h2><p>Start a new conversation.</p></div>';
  document.getElementById('input').focus();
  closeSidebar();
  renderSidebar();
}

// ── Messages ──
function renderMessages(msgs) {
  const container = document.getElementById('messages');
  container.innerHTML = '';
  if (!msgs || !msgs.length) {
    container.innerHTML = '<div class="welcome" id="welcome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg><h2>Askoda</h2><p>Select a conversation.</p></div>';
    return;
  }
  msgs.forEach(m => appendMessage(m.role, m.content, false));
  scrollBottom();
}

function appendMessage(role, content, scroll = true) {
  const container = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  const group = document.createElement('div');
  group.className = 'msg-group';
  const msg = document.createElement('div');
  msg.className = `msg ${role === 'user' ? 'user' : 'assistant'}`;
  if (role === 'assistant') {
    msg.innerHTML = marked.parse(content, { breaks: true });
    msg.querySelectorAll('pre').forEach(pre => {
      const code = pre.querySelector('code');
      if (!code) return;
      const lang = code.className.match(/language-(\w+)/);
      if (lang) { const l = document.createElement('div'); l.className = 'lang-label'; l.textContent = lang[1]; pre.prepend(l); }
      const btn = document.createElement('button');
      btn.className = 'copy-btn'; btn.textContent = 'Copy';
      btn.onclick = () => { navigator.clipboard.writeText(code.textContent); showToast('Copied!'); };
      pre.appendChild(btn);
    });
  } else { msg.textContent = content; }
  group.appendChild(msg);
  container.appendChild(group);
  if (scroll) scrollBottom();
}

function scrollBottom() {
  requestAnimationFrame(() => { document.getElementById('messages').scrollTop = 1e9; });
}

// ── Send ──
async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || streaming) return;
  input.value = '';
  autoResize(input);
  updateBtn();
  appendMessage('user', text);
  showThinking();
  streaming = true;
  abortController = new AbortController();
  document.getElementById('sendBtn').disabled = true;
  try {
    const body = { message: text };
    if (!isNewChat && currentSessionId) body.conversation_id = currentSessionId;
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body), signal: abortController.signal
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', responseText = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (typeof data === 'string') { currentSessionId = data; isNewChat = false; continue; }
            if (data.delta) { responseText += data.delta; updateStream(responseText); }
            if (data.response) { responseText = data.response; updateStream(responseText); }
            if (data.error) showToast('Error: ' + data.error);
          } catch(e) {}
        }
      }
    }
    removeThinking();
    if (responseText) appendMessage('assistant', responseText);
    loadProjects();
  } catch(e) {
    removeThinking();
    if (e.name !== 'AbortError') { appendMessage('assistant', 'Error: ' + e.message); showToast('Failed: ' + e.message); }
  } finally {
    streaming = false; abortController = null; updateBtn(); document.getElementById('input').focus();
  }
}

function updateStream(text) {
  const container = document.getElementById('messages');
  let el = document.getElementById('stream-msg');
  if (!el) {
    removeThinking();
    const g = document.createElement('div'); g.className = 'msg-group';
    el = document.createElement('div'); el.className = 'msg assistant'; el.id = 'stream-msg';
    g.appendChild(el); container.appendChild(g);
  }
  el.innerHTML = marked.parse(text, { breaks: true });
  scrollBottom();
}

function showThinking() {
  const container = document.getElementById('messages');
  const el = document.createElement('div'); el.className = 'thinking'; el.id = 'think-el';
  el.innerHTML = '<span>Thinking</span><div class="dots"><span></span><span></span><span></span></div>';
  container.appendChild(el); scrollBottom();
}
function removeThinking() { const el = document.getElementById('think-el'); if (el) el.remove(); }

// ── Input ──
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function updateBtn() { document.getElementById('sendBtn').disabled = !document.getElementById('input').value.trim() || streaming; }
function setupAutoResize() {
  const t = document.getElementById('input');
  t.addEventListener('input', () => { autoResize(t); updateBtn(); });
}
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

// ── Helpers ──
function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function basename(p) { return (p || '').split('/').filter(Boolean).pop() || p; }
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'now';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h';
  return d.toLocaleDateString();
}
</script>
</body>
</html>
